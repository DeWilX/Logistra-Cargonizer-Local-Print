name: Build desktop applications
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python ci_tests.py
      - run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Logistra-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
  release_build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python ci_tests.py
      - name: Build tagged release
        env:
          LOGISTRA_RELEASE_VERSION: ${{ github.ref_name }}
        run: python build_app.py
      - name: Verify packaged executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOGISTRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'Logistra-self-test'
          $report = Join-Path $env:RUNNER_TEMP 'Logistra-self-test.json'
          $result = Start-Process -FilePath '.\dist\Logistra-Print.exe' -ArgumentList @('--self-test', '--self-test-report', $report) -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE self-test failed' }
          $checks = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $checks.frozen -or -not $checks.default_test_pdf_bundled) { throw 'EXE dependencies missing' }
      - name: Verify packaged macOS application
        if: runner.os == 'macOS'
        run: |
          export LOGISTRA_DATA_DIR="$RUNNER_TEMP/Logistra-self-test"
          SSL_CERT_FILE=/nonexistent/certificates.pem SSL_CERT_DIR=/nonexistent dist/Logistra.app/Contents/MacOS/Logistra --self-test --self-test-network --self-test-report "$RUNNER_TEMP/Logistra-self-test.json"
          python -c 'import json, os; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]); r = json.loads((p / "Logistra-self-test.json").read_text()); c = json.loads((p / "Logistra-self-test/config.json").read_text()); assert r["frozen"] and r["assets_loaded"] and r["default_test_pdf_bundled"] and r["github_tls_checked"]; assert c["sender_id"] == c["printer"] == ""'
      - name: Audit packaged macOS defaults
        if: runner.os == 'macOS'
        run: python audit_macos_package.py dist/Logistra-macOS-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
  release:
    needs: release_build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "Logistra Print $GITHUB_REF_NAME"
