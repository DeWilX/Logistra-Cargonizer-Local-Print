name: Build desktop applications
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -q
      - run: python build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Logistra-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -q
      - name: Build tagged Windows release
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          python build_app.py --version $releaseVersion --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $env:LOGISTRA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'Logistra-self-test'
          $report = Join-Path $env:RUNNER_TEMP 'Logistra-self-test.json'
          $result = Start-Process -FilePath '.\dist\Logistra-Print.exe' -ArgumentList @('--self-test', '--self-test-report', $report) -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE self-test failed' }
          $checks = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $checks.frozen -or -not $checks.default_test_pdf_bundled) { throw 'EXE dependencies missing' }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Logistra-Print.exe dist/Logistra-Windows-exe.zip --verify-tag --generate-notes --title "Logistra Print $env:GITHUB_REF_NAME"
